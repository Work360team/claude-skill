<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Hide ez-toc-container - Required */
        div#ez-toc-container {
            display: none !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.8;
            color: #1e293b;
            background: #f8fafc;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 50%, #f5f3ff 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            animation: backgroundPulse 15s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes backgroundPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Reading Progress Bar */
        #reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 5px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            z-index: 10000;
            transition: width 0.1s ease;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.5);
        }

        /* Main Container */
        .article-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* Hero Section - Super Modern */
        .hero-section {
            position: relative;
            padding: 100px 40px;
            margin-bottom: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 30px;
            color: white;
            text-align: center;
            overflow: hidden;
            box-shadow: 
                0 20px 60px rgba(102, 126, 234, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        /* Animated Background Orbs */
        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -30px) rotate(5deg); }
            50% { transform: translate(-20px, 20px) rotate(-5deg); }
            75% { transform: translate(20px, 30px) rotate(3deg); }
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-section h1 {
            font-size: 3.5em;
            font-weight: 800;
            margin-bottom: 25px;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.2);
            animation: fadeInUp 0.8s ease;
            letter-spacing: -1px;
        }

        .hero-section .subtitle {
            font-size: 1.4em;
            opacity: 0.95;
            animation: fadeInUp 0.8s ease 0.2s backwards;
            max-width: 750px;
            margin: 0 auto;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Table of Contents - Light Glassmorphism Style */
        .toc-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 25px;
            padding: 0;
            margin: 50px 0;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.08),
                0 0 0 1px rgba(102, 126, 234, 0.1) inset,
                0 10px 30px rgba(102, 126, 234, 0.05);
            border: 1px solid rgba(102, 126, 234, 0.15);
            animation: fadeInUp 0.8s ease;
            transition: all 0.4s ease;
            overflow: hidden;
        }

        .toc-wrapper:hover {
            box-shadow: 
                0 25px 60px rgba(0,0,0,0.1),
                0 0 0 1px rgba(102, 126, 234, 0.2) inset,
                0 12px 35px rgba(102, 126, 234, 0.08);
            border-color: rgba(102, 126, 234, 0.25);
        }

        /* TOC Header - Clickable */
        .toc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 45px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
        }

        .toc-header:hover {
            background: rgba(102, 126, 234, 0.03);
        }

        .toc-header:active {
            transform: scale(0.99);
        }

        .toc-title {
            font-size: 2em;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toc-title::before {
            content: '📑';
            font-size: 1.4em;
            filter: drop-shadow(0 0 10px rgba(102, 126, 234, 0.3));
        }

        /* Toggle Icon */
        .toc-toggle {
            font-size: 1.5em;
            color: #667eea;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
            font-weight: bold;
        }

        .toc-wrapper.collapsed .toc-toggle {
            transform: rotate(-90deg);
        }

        /* TOC Content - Collapsible */
        .toc-content {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.3s ease,
                        padding 0.5s ease;
            opacity: 1;
            padding: 25px 45px 40px 45px;
        }

        .toc-wrapper.collapsed .toc-content {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        /* Counter Badge */
        .toc-counter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 24px;
            padding: 0 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 700;
            margin-left: 12px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .toc-list {
            list-style: none;
            counter-reset: toc-counter;
        }

        .toc-list li {
            counter-increment: toc-counter;
            margin: 18px 0;
            padding-left: 40px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toc-list li::before {
            content: counter(toc-counter);
            position: absolute;
            left: 0;
            top: 2px;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            font-weight: 800;
            box-shadow: 
                0 5px 15px rgba(102, 126, 234, 0.3),
                0 0 20px rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
        }

        .toc-list li:hover {
            transform: translateX(10px);
        }

        .toc-list li:hover::before {
            transform: scale(1.15) rotate(8deg);
            box-shadow: 
                0 8px 20px rgba(102, 126, 234, 0.5),
                0 0 30px rgba(102, 126, 234, 0.4);
        }

        .toc-list a {
            color: #334155;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.05em;
        }

        .toc-list a:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Content Cards - Light Glass Morphism */
        .content-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 30px;
            padding: 50px;
            margin: 40px 0;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(102, 126, 234, 0.1) inset,
                0 10px 25px rgba(102, 126, 234, 0.05);
            border: 1px solid rgba(102, 126, 234, 0.15);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .content-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at center,
                rgba(102, 126, 234, 0.05) 0%,
                transparent 70%
            );
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        .content-box:hover::before {
            opacity: 1;
        }
        
        .content-box:hover {
            transform: translateY(-8px);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(102, 126, 234, 0.2) inset,
                0 15px 35px rgba(102, 126, 234, 0.1);
            border-color: rgba(102, 126, 234, 0.3);
        }
        
        /* Shimmering gradient border on hover */
        .content-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 30px;
            padding: 2px;
            background: linear-gradient(
                135deg,
                rgba(102, 126, 234, 0.4),
                rgba(118, 75, 162, 0.4),
                rgba(147, 51, 234, 0.4)
            );
            background-size: 200% 200%;
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            animation: shimmer 3s ease infinite;
        }
        
        .content-box:hover::after {
            opacity: 1;
        }
        
        @keyframes shimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        
        /* First box special styling */
        .content-box.first-box {
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.25);
        }
        
        .content-box.first-box::after {
            opacity: 0.3;
        }

        .content-box:hover::before {
            opacity: 0.5;
        }

        .content-box:hover {
            transform: translateY(-8px);
            box-shadow: 
                0 25px 50px rgba(102, 126, 234, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        /* First Box Special Style */
        .content-box.first-box {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%),
                        rgba(255, 255, 255, 0.9);
            border-left: 5px solid #667eea;
        }

        /* Article Content Typography - Light Theme */
        .content-box h2 {
            font-size: 2.4em;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 35px 0;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
            scroll-margin-top: 80px;
            position: relative;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .content-box h2::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
            animation: slideIn 0.8s ease-out;
        }
        
        @keyframes slideIn {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 80px;
                opacity: 1;
            }
        }

        .content-box h3 {
            font-size: 1.7em;
            color: #334155;
            margin: 40px 0 25px 0;
            scroll-margin-top: 80px;
            font-weight: 700;
            position: relative;
            padding-left: 25px;
            transition: all 0.3s ease;
        }

        .content-box h3::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 70%;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
        }

        .content-box h4 {
            font-size: 1.35em;
            color: #475569;
            margin: 30px 0 18px 0;
            font-weight: 600;
        }

        .content-box p {
            margin: 25px 0;
            color: #334155;
            font-size: 1.1em;
            line-height: 1.95;
        }

        .content-box ul, .content-box ol {
            margin: 30px 0;
            padding-left: 40px;
        }

        .content-box li {
            margin: 15px 0;
            color: #334155;
            line-height: 1.9;
        }

        .content-box li::marker {
            color: #667eea;
            font-weight: 700;
        }
        
        /* Links with gradient hover */
        .content-box a {
            color: #667eea;
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 500;
        }
        
        .content-box a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .content-box a:hover::after {
            width: 100%;
        }
        
        .content-box a:hover {
            filter: brightness(1.1);
        }

        .content-box blockquote {
            margin: 40px 0;
            padding: 35px 40px;
            background: rgba(102, 126, 234, 0.08);
            backdrop-filter: blur(10px);
            border-left: 6px solid #667eea;
            border-radius: 0 20px 20px 0;
            font-style: italic;
            color: #475569;
            position: relative;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.05),
                0 0 20px rgba(102, 126, 234, 0.05) inset;
        }

        .content-box blockquote::before {
            content: '"';
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 4em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: Georgia, serif;
            line-height: 1;
            opacity: 0.2;
        }

        .content-box code {
            background: rgba(102, 126, 234, 0.1);
            padding: 5px 12px;
            border-radius: 8px;
            font-family: 'Fira Code', 'Courier New', monospace;
            color: #764ba2;
            font-size: 0.92em;
            border: 1px solid rgba(102, 126, 234, 0.15);
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .content-box pre {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            padding: 35px;
            border-radius: 20px;
            overflow-x: auto;
            margin: 40px 0;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.15),
                0 0 0 1px rgba(102, 126, 234, 0.2) inset,
                0 0 30px rgba(102, 126, 234, 0.08) inset;
            position: relative;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .content-box pre::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
            border-radius: 20px 20px 0 0;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        /* macOS style window buttons */
        .content-box pre::after {
            content: '';
            position: absolute;
            top: 18px;
            left: 22px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f57;
            box-shadow: 
                20px 0 0 #febc2e,
                40px 0 0 #28c840,
                0 0 10px rgba(255, 95, 87, 0.5),
                20px 0 10px rgba(254, 188, 46, 0.5),
                40px 0 10px rgba(40, 200, 64, 0.5);
        }

        .content-box pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            border: none;
            box-shadow: none;
            display: block;
            margin-top: 45px;
            font-size: 0.95em;
            line-height: 1.7;
        }

        .content-box img {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            margin: 45px 0;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.1),
                0 0 0 1px rgba(102, 126, 234, 0.1) inset;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(102, 126, 234, 0.15);
        }

        .content-box img:hover {
            transform: scale(1.03) translateY(-8px) rotateZ(-1deg);
            box-shadow: 
                0 30px 70px rgba(102, 126, 234, 0.2),
                0 0 0 1px rgba(102, 126, 234, 0.2) inset,
                0 0 40px rgba(102, 126, 234, 0.15);
        }

        .content-box strong {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .content-box em {
            font-style: italic;
            color: #546e7a;
        }

        /* Tables - Light Glass Morphism */
        .table-wrapper {
            overflow-x: auto;
            margin: 45px 0;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.08),
                0 0 0 1px rgba(102, 126, 234, 0.15) inset,
                0 0 30px rgba(102, 126, 234, 0.05) inset;
            border: 1px solid rgba(102, 126, 234, 0.15);
            transition: all 0.4s ease;
        }

        .content-box table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1em;
            border-radius: 20px;
            overflow: hidden;
        }

        .content-box table thead {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
        }

        .content-box table thead tr {
            border-bottom: 2px solid transparent;
            position: relative;
        }

        .content-box table thead tr::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .content-box table th {
            padding: 20px 25px;
            text-align: left;
            font-weight: 700;
            font-size: 1.05em;
            color: #1e293b;
            letter-spacing: 0.3px;
        }

        .content-box table tbody tr {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
        }

        .content-box table tbody tr:last-child {
            border-bottom: none;
        }

        /* Hover state - use box-shadow instead of ::before for left border */
        .content-box table tbody tr:hover {
            background: rgba(102, 126, 234, 0.05);
            box-shadow: 
                inset 4px 0 0 0 #667eea,
                inset 0 0 20px rgba(102, 126, 234, 0.08);
        }

        .content-box table td {
            padding: 18px 25px;
            color: #475569;
            font-size: 1em;
            line-height: 1.6;
            transition: color 0.3s ease;
        }

        .content-box table tbody tr:hover td {
            color: #1e293b;
        }

        /* Table responsive */
        @media (max-width: 768px) {
            .table-wrapper {
                margin: 30px -20px;
                border-radius: 0;
            }
            
            .content-box table th,
            .content-box table td {
                padding: 12px 15px;
                font-size: 0.9em;
            }
        }

        /* Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Back to Top Button - Floating Modern Design */
        #back-to-top {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.8em;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 10px 30px rgba(102, 126, 234, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            z-index: 1000;
        }

        #back-to-top.visible {
            opacity: 1;
            visibility: visible;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #back-to-top:hover {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 
                0 15px 40px rgba(102, 126, 234, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.3) inset;
        }

        #back-to-top:active {
            transform: translateY(-5px) scale(1.05);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-section {
                padding: 70px 30px;
            }

            .hero-section h1 {
                font-size: 2.2em;
            }

            .hero-section .subtitle {
                font-size: 1.15em;
            }

            .content-box {
                padding: 35px 25px;
                border-radius: 20px;
            }

            .content-box h2 {
                font-size: 1.8em;
            }

            .content-box h3 {
                font-size: 1.4em;
            }

            .toc-wrapper {
                padding: 25px 20px;
            }

            .toc-title {
                font-size: 1.5em;
            }

            #back-to-top {
                bottom: 25px;
                right: 25px;
                width: 50px;
                height: 50px;
                font-size: 1.5em;
            }
        }

        @media (max-width: 480px) {
            .hero-section {
                padding: 50px 20px;
                border-radius: 20px;
            }

            .hero-section h1 {
                font-size: 1.8em;
            }

            .hero-section .subtitle {
                font-size: 1em;
            }

            .content-box {
                padding: 30px 20px;
                margin: 20px 0;
            }

            .content-box h2 {
                font-size: 1.5em;
            }

            .content-box h3 {
                font-size: 1.2em;
            }

            .toc-wrapper {
                padding: 20px 15px;
            }
        }

        /* Selection Color */
        ::selection {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        ::-moz-selection {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <!-- Reading Progress Bar -->
    <div id="reading-progress"></div>

    <div class="article-container">
        <!-- Hero Section -->
        <div class="hero-section">
            <div class="hero-content">
                <h1>{{TITLE}}</h1>
                <div class="subtitle">{{SUBTITLE}}</div>
            </div>
        </div>

        <!-- Table of Contents (Collapsible) -->
        <div class="toc-wrapper" id="toc-wrapper">
            <div class="toc-header" onclick="toggleTOC()">
                <div class="toc-title">
                    สารบัญ
                    <span class="toc-counter" id="toc-counter">0</span>
                </div>
                <span class="toc-toggle">▼</span>
            </div>
            <div class="toc-content">
                <ul class="toc-list">
                    {{TOC_ITEMS}}
                </ul>
            </div>
        </div>

        <!-- Article Content -->
        {{CONTENT}}
    </div>

    <!-- Back to Top Button -->
    <button id="back-to-top" aria-label="Back to top">↑</button>

    <script>
        // Reading Progress Bar
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('reading-progress').style.width = scrolled + '%';
        });

        // Smooth Scrolling for TOC links
        document.querySelectorAll('.toc-list a').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // TOC Counter Update
        const tocCount = document.querySelectorAll('.toc-list li').length;
        const tocCounter = document.getElementById('toc-counter');
        if (tocCounter) {
            tocCounter.textContent = tocCount;
        }

        // Toggle TOC Function
        function toggleTOC() {
            const tocWrapper = document.getElementById('toc-wrapper');
            tocWrapper.classList.toggle('collapsed');
            
            // Save state to localStorage
            const isCollapsed = tocWrapper.classList.contains('collapsed');
            localStorage.setItem('tocCollapsed', isCollapsed);
        }

        // Restore TOC state from localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const tocWrapper = document.getElementById('toc-wrapper');
            const tocCollapsed = localStorage.getItem('tocCollapsed');
            
            // Default: เปิดอยู่ถ้ามี TOC น้อยกว่า 10 items, ปิดถ้ามากกว่า
            if (tocCollapsed === null) {
                const tocCount = document.querySelectorAll('.toc-list li').length;
                if (tocCount > 10) {
                    tocWrapper.classList.add('collapsed');
                }
            } else if (tocCollapsed === 'true') {
                tocWrapper.classList.add('collapsed');
            }
        });

        // Back to Top Button
        const backToTopBtn = document.getElementById('back-to-top');
        
        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 400) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Parallax effect for hero section (subtle)
        window.addEventListener('scroll', () => {
            const hero = document.querySelector('.hero-section');
            if (hero) {
                const scrolled = window.pageYOffset;
                hero.style.transform = `translateY(${scrolled * 0.3}px)`;
                hero.style.opacity = 1 - (scrolled / 600);
            }
        });
    </script>
</body>
</html>
